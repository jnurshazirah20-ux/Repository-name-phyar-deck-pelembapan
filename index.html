<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#42d8c0">
  <title>PhyAR Deck: Pelembapan</title>

  <!-- A-Frame dan MindAR (versi serasi) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root { --navy:#082b4c; --mint:#76efd5; --turquoise:#1bc7ba; --yellow:#ffd84d; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#cffff1; font-family:Arial,sans-serif; color:var(--navy); }
    body.ar-active { touch-action:none; user-select:none; -webkit-user-select:none; }
    .overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(145deg,var(--mint),var(--turquoise)); }
    .card { width:min(92vw,460px); padding:30px 24px; text-align:center; background:rgba(255,255,255,.96); border-radius:28px; box-shadow:0 18px 50px rgba(4,54,74,.22); border:3px solid rgba(255,255,255,.65); }
    h1 { margin:0 0 8px; font-size:clamp(27px,8vw,42px); line-height:1; }
    .tag { display:inline-block; margin:5px 0 18px; padding:7px 13px; border-radius:999px; background:var(--yellow); font-weight:800; }
    p { margin:0 0 22px; font-size:18px; line-height:1.45; }
    button { border:0; cursor:pointer; font:inherit; font-weight:900; }
    #startButton { width:100%; min-height:62px; border-radius:18px; color:white; font-size:23px; background:linear-gradient(135deg,#08aa9d,#00d4b8); box-shadow:0 8px 0 #087d76; }
    #startButton:active { transform:translateY(4px); box-shadow:0 4px 0 #087d76; }
    #startButton:disabled { opacity:.55; cursor:wait; }
    #errorBox { margin-top:18px; padding:12px; border-radius:14px; color:#7e1923; background:#ffe1e4; font-weight:700; }
    #loadingOverlay { background:rgba(5,38,64,.88); color:white; font-size:21px; font-weight:800; }
    .spinner { width:48px; height:48px; margin-right:15px; border:6px solid rgba(255,255,255,.3); border-top-color:var(--yellow); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #instructionPanel, #statusMessage { position:fixed; z-index:30; left:50%; transform:translateX(-50%); text-align:center; border-radius:16px; font-weight:800; box-shadow:0 8px 25px rgba(0,0,0,.2); }
    #instructionPanel { top:max(18px,env(safe-area-inset-top)); width:min(90vw,430px); padding:12px 18px; background:rgba(255,255,255,.94); }
    #statusMessage { top:82px; padding:11px 20px; color:var(--navy); background:var(--yellow); }
    #closeButton { position:fixed; z-index:31; right:14px; bottom:max(18px,env(safe-area-inset-bottom)); padding:12px 17px; border-radius:14px; color:white; background:#092e4d; box-shadow:0 5px 16px rgba(0,0,0,.25); }
    .hidden { display:none !important; }
    a-scene { position:fixed !important; inset:0; width:100%; height:100%; }
  </style>
</head>

<body>
  <section id="startScreen" class="overlay" aria-label="Mula PhyAR Deck">
    <div class="card">
      <h1>PhyAR Deck</h1>
      <div class="tag">Pelembapan</div>
      <p>Tekan MULA AR, benarkan akses kamera dan halakan kamera pada kad Pelembapan.</p>
      <button id="startButton" type="button" aria-label="Mulakan kamera realiti terimbuh">MULA AR</button>
      <div id="errorBox" class="hidden" role="alert"></div>
    </div>
  </section>

  <div id="loadingOverlay" class="overlay hidden" aria-live="polite">
    <div class="spinner"></div><span>Memuatkan PhyAR Deck…</span>
  </div>

  <div id="instructionPanel" class="hidden">Halakan kamera pada keseluruhan kad.</div>
  <div id="statusMessage" class="hidden" aria-live="polite">Kad dikesan!</div>
  <button id="closeButton" class="hidden" type="button">Tutup AR</button>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./pelembapan.mind; autoStart: false;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="20000">
      <!-- TUKAR VIDEO: ubah nama fail pada src jika diperlukan. -->
      <video id="pelembapanVideo" src="./video-pelembapan.mp4"
        preload="auto" loop muted playsinline webkit-playsinline
        crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TUKAR TARGET: nama .mind ditetapkan pada mindar-image di atas. -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- TUKAR SAIZ/POSISI: ubah width, height dan position di bawah.
           Nisbah semasa 16:9: width 1.2, height 0.675. -->
      <a-video src="#pelembapanVideo" position="0 0 0.03" rotation="0 0 0"
        width="1.2" height="0.675"></a-video>
    </a-entity>
  </a-scene>

  <script>
    (() => {
      const scene = document.querySelector('#arScene');
      const target = document.querySelector('#target');
      const video = document.querySelector('#pelembapanVideo');
      const startScreen = document.querySelector('#startScreen');
      const startButton = document.querySelector('#startButton');
      const loadingOverlay = document.querySelector('#loadingOverlay');
      const instructionPanel = document.querySelector('#instructionPanel');
      const statusMessage = document.querySelector('#statusMessage');
      const closeButton = document.querySelector('#closeButton');
      const errorBox = document.querySelector('#errorBox');
      let arStarted = false;
      let statusTimer;

      function waitForSceneLoaded() {
        if (scene.hasLoaded) return Promise.resolve();
        return new Promise(resolve => scene.addEventListener('loaded', resolve, { once:true }));
      }

      async function unlockMobileVideo() {
        video.muted = true;
        try {
          await video.play();
          video.pause();
          video.currentTime = 0;
        } catch (e) {
          console.warn('Video akan dimainkan selepas target dikesan.', e);
        }
      }

      async function startAR() {
        if (arStarted) return;
        errorBox.classList.add('hidden');

        if (!window.isSecureContext) {
          errorBox.textContent = 'PhyAR Deck perlu dibuka melalui pautan HTTPS untuk menggunakan kamera.';
          errorBox.classList.remove('hidden');
          return;
        }
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
          errorBox.textContent = 'Pelayar ini tidak menyokong kamera WebAR. Buka pautan melalui Chrome atau Safari.';
          errorBox.classList.remove('hidden');
          return;
        }

        startButton.disabled = true;
        startScreen.classList.add('hidden');
        loadingOverlay.classList.remove('hidden');

        try {
          await unlockMobileVideo();
          await waitForSceneLoaded();
          const mindarSystem = scene.systems['mindar-image-system'];
          if (!mindarSystem) throw new Error('Sistem MindAR gagal dimuatkan.');
          await mindarSystem.start();

          arStarted = true;
          document.body.classList.add('ar-active');
          loadingOverlay.classList.add('hidden');
          instructionPanel.classList.remove('hidden');
          closeButton.classList.remove('hidden');
        } catch (error) {
          console.error(error);
          arStarted = false;
          loadingOverlay.classList.add('hidden');
          instructionPanel.classList.add('hidden');
          closeButton.classList.add('hidden');
          startScreen.classList.remove('hidden');
          startButton.disabled = false;
          errorBox.textContent = (error && (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError'))
            ? 'Akses kamera diperlukan untuk menggunakan PhyAR Deck.'
            : 'AR tidak dapat dimulakan. Pastikan akses kamera dibenarkan dan semua fail berada dalam folder yang sama.';
          errorBox.classList.remove('hidden');
        }
      }

      async function stopAR() {
        video.pause();
        video.currentTime = 0;
        clearTimeout(statusTimer);
        statusMessage.classList.add('hidden');
        instructionPanel.classList.add('hidden');
        closeButton.classList.add('hidden');

        const mindarSystem = scene.systems['mindar-image-system'];
        if (mindarSystem && arStarted) await mindarSystem.stop();

        arStarted = false;
        document.body.classList.remove('ar-active');
        startButton.disabled = false;
        startScreen.classList.remove('hidden');
      }

      target.addEventListener('targetFound', async () => {
        if (!arStarted) return;
        instructionPanel.classList.add('hidden');
        statusMessage.classList.remove('hidden');
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => statusMessage.classList.add('hidden'), 1800);
        video.pause();
        video.currentTime = 0;
        try { await video.play(); } catch (e) { console.warn('Video gagal dimainkan.', e); }
      });

      target.addEventListener('targetLost', () => {
        video.pause();
        video.currentTime = 0;
        statusMessage.classList.add('hidden');
        if (arStarted) instructionPanel.classList.remove('hidden');
      });

      startButton.addEventListener('click', startAR);
      closeButton.addEventListener('click', stopAR);
      window.addEventListener('pagehide', () => { if (arStarted) stopAR(); });
    })();
  </script>
</body>
</html>
